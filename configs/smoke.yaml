name: smoke
out_dir: results/smoke
data_dir: data
device: auto

architectures: [mlp, cnn, ae]
sizes: [4000, 12000]
attacks: [signflip, data, fabricate]
severities: [0.1, 0.5]
seeds: [0]
n_honest: 2
n_malicious: 2
train_frac: 0.3
verifier_steps: match
save_snapshots: true

data:
  higgs_rows: 4000
  petimages: 2000
  mnist: 2000

training:
  epochs: 20
  batch_size: 32
  augment: true

judge:
  window: 10
  epochs: 2
  patience: 1

performance:
  n_honest: 1
  n_malicious: 1

validate:
  replay: true
  spot_segments: 3
  spot_steps: 10
