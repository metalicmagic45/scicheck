name: paper
out_dir: results/paper
data_dir: data
device: auto
deterministic: false

architectures: [mlp, cnn, ae]
sizes: [100000, 300000, 500000]
attacks: [signflip, data, fabricate]
severities: [0.1, 0.3, 0.5]
seeds: [0, 1, 2]
n_honest: 15
n_malicious: 5
train_frac: 0.3
verifier_steps: match
data_seed: 0
save_snapshots: true

data:
  higgs_rows: 200000
  petimages: 0
  mnist: 0
  test_frac: 0.15

training:
  epochs: 25
  batch_size: 128
  lr: 0.001
  augment: true

judge:
  window: 30
  d_model: 64
  n_heads: 4
  d_ff: 128
  e_layers: 2
  dropout: 0.0
  lam: 3.0
  epochs: 15
  patience: 5
  lr: 0.0001
  batch_size: 32
  temperature: 50.0
  split: [0.70, 0.15, 0.15]
  r: 0.01
  eta_baseline: train
  score_batch_size: 1024
  baselines: [iforest, ocsvm]

validate:
  theta: 0.3
  rho: 0.4
  replay: true
  spot_segments: 10
  spot_steps: 50

performance:
  n_honest: 2
  n_malicious: 2
  severity: 0.3
  sweeps: [runtime, memory]
